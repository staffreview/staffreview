version = 1
timeout_minutes = 30
triggers = [
  { event = "commit", branch = { names = ["main"] } },
  { event = "commit", pull_request = { state = "open", draft = false } },
]
environment = { CI = "true", NEXT_TELEMETRY_DISABLED = "1" }

[container]
image = "oven/bun:1"
cpu = 2
memory_mb = 4096
prepareInputs = ["bun.lock", "package.json", "apps/*/package.json"]
prepare = """
set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get update
apt-get install -y --no-install-recommends git
rm -rf /var/lib/apt/lists/*
bun install --frozen-lockfile --ignore-scripts
"""
