# This job intentionally runs the review model as root with credentials in its
# environment. Only the repository owner can open pull requests that run
# Informant jobs, so PR content is trusted and there is no prompt-injection
# threat to defend against.
name = "Staff Review"
runs_on = ["container", "arm64", "mount:pi-auth"]
optional = true
timeout_minutes = 60
command = """
set -eu
pr_number="${INFORMANT_BRANCH#pull/}"
case "$pr_number" in
  ""|*[!0-9]*)
    echo "staff review can only run for a numeric pull request ref" >&2
    exit 1
    ;;
esac
npm install --global @staffreview/staff@1.10.4

pr_shas() {
  gh api "repos/$INFORMANT_REPOSITORY/pulls/$pr_number" \
    --jq '.head.sha + " " + .base.sha'
}
set -- $(pr_shas)
head_sha="$1"
base_sha="$2"
if [ "$head_sha" != "$INFORMANT_SHA" ]; then
  echo "pull request head changed before staff review" >&2
  exit 1
fi

merge_base="$(git merge-base "$base_sha" "$head_sha")"
staff diff --base "$merge_base" --head working-tree --json >/dev/null
slug="$merge_base..WT"

export PI_CODING_AGENT_DIR="$(mktemp -d)"
cp -a /mnt/informant-pi/. "$PI_CODING_AGENT_DIR/"
PI_OFFLINE=0 pi install npm:@vessup/pi-kit@0.1.2
pi --print \
  --no-session \
  --no-approve \
  --no-extensions \
  --extension "$PI_CODING_AGENT_DIR/npm/node_modules/@vessup/pi-kit/extensions/subagents.ts" \
  --no-skills \
  --no-prompt-templates \
  --no-context-files \
  --tools bash,read,grep,find,ls,subagent_create,subagent_read,subagent_terminate \
  --skill "$PWD/.agents/skills/staff-review/SKILL.md" \
  --skill "$PWD/.agents/skills/staff-review-find/SKILL.md" \
  --skill "$PWD/.agents/skills/staff-review-verify/SKILL.md" \
  --skill "$PWD/.agents/skills/staff-comment/SKILL.md" \
  "/skill:staff-review $slug" > /tmp/staff-review-output.txt

# A long review must never publish findings for an obsolete PR head.
set -- $(pr_shas)
if [ "$1" != "$head_sha" ] || [ "$2" != "$base_sha" ]; then
  echo "pull request changed during staff review" >&2
  exit 1
fi

staff review post --slug "$slug" --pr "$pr_number" \
  --github-repo "$INFORMANT_REPOSITORY" --commit "$head_sha"
"""
triggers = [{ pull_request = { state = "open", draft = false } }]
secrets = ["GITHUB_TOKEN"]
environment = { PI_OFFLINE = "1" }
mounts = [{ source = "pi-auth", target = "/mnt/informant-pi", write_back = false }]
cache = [{ paths = ["~/.bun/install/cache"], shared = true }]
container = { image = "docker.io/oven/bun:1.3.10", cpu = 2, memory_mb = 4096, prepare = """
set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get update
apt-get install -y --no-install-recommends ca-certificates gh git npm ripgrep
rm -rf /var/lib/apt/lists/*
bun add --global --ignore-scripts @earendil-works/pi-coding-agent@0.84.1
ln -sf "$HOME/.bun/bin/pi" /usr/local/bin/pi
ln -sf "$(command -v bun)" /usr/local/bin/node
""" }
