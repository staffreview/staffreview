name = "Staff Review"
# Allowed mounts automatically advertise a namespaced worker capability.
runs_on = ["container", "arm64", "mount:pi-auth"]
optional = true
command = """
set -eu
review_root="$PWD"
review_home="$(mktemp -d)"
pr_number="${INFORMANT_BRANCH#pull/}"
if [ "$pr_number" = "$INFORMANT_BRANCH" ]; then
  echo "staff review can only run for a pull request" >&2
  exit 1
fi
github_token="$GITHUB_TOKEN"
export GH_TOKEN="$github_token"
github_api_url="${GITHUB_API_URL:-https://api.github.com}"
pr_json="$(curl -fsSL \
  -H "Accept: application/vnd.github+json" \
  -H "Authorization: Bearer $github_token" \
  -H "X-GitHub-Api-Version: 2022-11-28" \
  "$github_api_url/repos/$INFORMANT_REPOSITORY/pulls/$pr_number")"
head_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha')"
base_sha="$(printf '%s' "$pr_json" | jq -r '.base.sha')"
if [ "$head_sha" != "$INFORMANT_SHA" ]; then
  echo "pull request head changed before staff review" >&2
  exit 1
fi

merge_base="$(git merge-base "$base_sha" "$head_sha")"
staff diff --base "$merge_base" --head working-tree --json >/dev/null
slug="$merge_base..WT"
review_agents="$(staff settings get reviewAgents)"

unset GITHUB_TOKEN
unset GH_TOKEN
unset CI
export HOME="$review_home"
export XDG_CONFIG_HOME="$review_home/.config"
export NODE_AUTH_TOKEN="$github_token"
export NPM_CONFIG_USERCONFIG="$review_home/.npmrc"
cat > "$NPM_CONFIG_USERCONFIG" <<'EOF'
@vessup:registry=https://npm.pkg.github.com
//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
EOF
export PI_OFFLINE=0
pi install npm:@vessup/pi-kit@0.1.1
export PI_OFFLINE=1
unset NODE_AUTH_TOKEN
export INFORMANT_REVIEW_ROOT="$review_root"
cd "$review_root"
pi_kit_subagents="$PI_CODING_AGENT_DIR/npm/node_modules/@vessup/pi-kit/extensions/subagents.ts"
test -f "$pi_kit_subagents"
pi --print \
  --no-session \
  --no-approve \
  --no-extensions \
  --extension "$pi_kit_subagents" \
  --no-skills \
  --no-prompt-templates \
  --no-context-files \
  --tools bash,read,grep,find,ls,subagent_create,subagent_read,subagent_terminate \
  --skill /opt/informant/skills/staff-review/SKILL.md \
  --skill /opt/informant/skills/staff-review-find/SKILL.md \
  --skill /opt/informant/skills/staff-review-verify/SKILL.md \
  "/skill:staff-review $slug $review_agents" > /tmp/staff-review-findings.json

jq -e 'type == "array"' /tmp/staff-review-findings.json >/dev/null
jq -c '.[]' /tmp/staff-review-findings.json | while IFS= read -r finding; do
  printf '%s' "$finding" | jq -e '
    def positive_integer: if type == "number" then floor == . and . > 0 else false end;
    def valid_end($line): . == null or (if type == "number" then floor == . and . >= $line else false end);
    . as $finding |
    type == "object" and
    ($finding.side == "new" or $finding.side == "old") and
    ($finding.priority == "P1" or $finding.priority == "P2" or $finding.priority == "P3") and
    ($finding.body | type == "string" and length > 0) and
    (($finding.file == null and $finding.line == null and $finding.endLine == null) or
      (($finding.file | type == "string" and length > 0) and
       ($finding.line | positive_integer) and
       ($finding.endLine | valid_end($finding.line))))
  ' >/dev/null
  file="$(printf '%s' "$finding" | jq -r '.file // ""')"
  priority="$(printf '%s' "$finding" | jq -r '.priority')"
  body="$(printf '%s' "$finding" | jq -r '.body')"
  set -- comment add --slug "$slug" --author "Pi Staff Review" --priority "$priority"
  if [ -n "$file" ]; then
    line="$(printf '%s' "$finding" | jq -r '.line')"
    end_line="$(printf '%s' "$finding" | jq -r '.endLine // ""')"
    side="$(printf '%s' "$finding" | jq -r '.side')"
    case "$file" in /*|../*|*/../*|*/..) echo "invalid finding path: $file" >&2; exit 1;; esac
    set -- "$@" --file "$file" --line "$line" --side "$side"
    if [ -n "$end_line" ]; then set -- "$@" --end-line "$end_line"; fi
  fi
  printf '%s' "$body" | staff "$@" >/dev/null
done

export GH_TOKEN="$github_token"
staff review post --slug "$slug" --pr "$pr_number" --github-repo "$INFORMANT_REPOSITORY" --commit "$head_sha"
"""
triggers = [{ event = "commit", pull_request = { state = "open", draft = false } }]
secrets = ["GITHUB_TOKEN"]
environment = { PI_CODING_AGENT_DIR = "/mnt/informant-pi", PI_OFFLINE = "1" }
mounts = [{ source = "pi-auth", target = "/mnt/informant-pi", write_back = true }]
cache = [{ paths = ["~/.bun/install/cache"], shared = true }]
container = { image = "docker.io/oven/bun:1", cpu = 2, memory_mb = 4096, trustedPrepareInputs = true, prepareInputs = [".agents/skills/staff-review/**", ".agents/skills/staff-review-find/**", ".agents/skills/staff-review-verify/**"], prepare = """
set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get update
apt-get install -y --no-install-recommends ca-certificates curl git jq ripgrep
rm -rf /var/lib/apt/lists/*
export HOME=/root
mkdir -p "$HOME/.bun/install/global" "$HOME/.bun/bin" /opt/informant/skills
cp -R /workspace/.agents/skills/staff-review /opt/informant/skills/
cp -R /workspace/.agents/skills/staff-review-find /opt/informant/skills/
cp -R /workspace/.agents/skills/staff-review-verify /opt/informant/skills/
chmod -R a-w /opt/informant/skills
rm -rf /workspace/* /workspace/.[!.]* /workspace/..?*
BUN_INSTALL_BIN="$HOME/.bun/bin" bun add --global --ignore-scripts \
  @earendil-works/pi-coding-agent@0.84.1
ln -sf "$HOME/.bun/bin/pi" /usr/local/bin/pi
ln -sf "$(command -v bun)" /usr/local/bin/node
curl -fsSL https://github.com/staffreview/staffreview/releases/download/v1.10.3/staff-linux-arm64 \
  -o /usr/local/bin/staff
chmod +x /usr/local/bin/staff
""" }
