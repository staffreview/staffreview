name = "Staff Review"
color = "blue"
icon = "MessagePreview01Icon"

[[services]]
name = "Codex / Claude"

[[services.services]]
name = "Codex"
command = "codex -s workspace-write --add-dir \"$SPAREHOST_PROJECT_DIR\""

[[services.services]]
name = "Claude"
command = "claude --permission-mode auto --effort xhigh --name ${SPAREHOST_WORKTREE:-main}"

[[services]]
name = "Shell"

[[services]]
name = "Staff Review"
working_dir = "apps/staffreview"
command = "bun dev --base main"
local_domains = [
  "staff.sr",
]
