name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          # darwin-x64 cross-compiles on Linux via Bun, avoiding the slow/scarce
          # macOS-13 Intel runner queue (which stalled the v1.0.0 release).
          - os: ubuntu-latest
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run --filter @staffreview/staff build:binary:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: staff-${{ matrix.target }}
          path: apps/staffreview/dist/staff-${{ matrix.target }}

  publish-package:
    name: Publish package
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@staffreview"
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          package_version=$(node -p "require('./apps/staffreview/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi
      - name: Smoke-test package tarball
        run: bun run --cwd apps/staffreview test:package
      - name: Publish to GitHub Packages
        working-directory: apps/staffreview
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          if npm view "@staffreview/staff@$package_version" version >/dev/null 2>&1; then
            echo "@staffreview/staff@$package_version is already published"
          else
            npm publish
          fi

  release:
    needs: [build, publish-package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Compute checksums
        run: |
          cd artifacts
          for f in staff-*; do
            shasum -a 256 "$f" | tee -a SHA256SUMS
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/staff-*
            artifacts/SHA256SUMS
          generate_release_notes: true
